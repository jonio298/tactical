<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Sakura Tactics · Painterly Duel</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#120b20;color:#ffeaf2;font-family:Georgia,serif;touch-action:none}canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;touch-action:none}#status{position:absolute;left:50%;top:9%;transform:translateX(-50%);z-index:2;pointer-events:none;font:700 clamp(10px,1.5vw,18px) system-ui;color:#fff2f7;text-shadow:0 2px 8px #1d001c,0 0 12px #aa1744;background:#171222bd;border:1px solid #f6a6b5;border-radius:13px;padding:6px 16px;white-space:nowrap}#restart{position:absolute;right:1.7%;top:8%;background:#160e22c9;color:#fff;border:1px solid #fba8c2;border-radius:10px;padding:6px 10px;font:700 12px system-ui;z-index:2}#hint{position:absolute;bottom:2%;left:2%;font:600 clamp(10px,1.3vw,16px) system-ui;text-shadow:0 2px 6px #19000f;background:#160d21c0;padding:6px 12px;border:1px solid #d6a0bb;border-radius:10px;max-width:49%}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:5;opacity:0;transition:opacity .2s}#overlay>div{background:#170b22e8;border:2px solid #ffb6cf;border-radius:18px;padding:20px 42px;text-align:center;font:bold clamp(20px,5vw,48px) Georgia;box-shadow:0 0 80px #ed387e88}#overlay span{display:block;font:600 14px system-ui;margin-top:10px;color:#ffd3e4}@media(orientation:portrait){#hint{bottom:15%}#status{top:16%}#restart{top:13%}}
</style></head><body><canvas id="battle" width="1648" height="928" aria-label="Painterly samurai battle with octagon spaces"></canvas><div id="status">YOUR TURN · Tap the Oni, then choose an attack</div><button id="restart">↻ RESTART</button><div id="hint">Select the Oni · Tap Slash or 10-Hit Slash Combo</div><div id="overlay"><div id="result">VICTORY<span>THE ONI IS DEFEATED</span></div></div><script>
(()=>{'use strict';const canvas=document.getElementById('battle'),g=canvas.getContext('2d'),status=document.getElementById('status'),hint=document.getElementById('hint'),overlay=document.getElementById('overlay');const W=1648,H=928,art=new Image();art.src='assets/painterly_battle.jpg';const buttons={move:[442,735,590,867],guard:[612,735,762,870],slash:[788,731,944,868],gale:[970,734,1132,872],ultimate:[1160,689,1481,895]};let state,prev=0;const rnd=(a,b)=>a+Math.random()*(b-a),ease=x=>x*x*(3-2*x);function reset(){state={heroHP:3120,enemyHP:3860,turn:1,target:false,mode:'ready',selected:null,attack:null,particles:[],floaters:[],petals:Array.from({length:50},()=>({x:rnd(0,W),y:rnd(-20,H),v:rnd(22,65),a:rnd(0,6),s:rnd(2,7)})),shake:0,flash:0,swing:0,retaliateAt:0};status.textContent='YOUR TURN · Tap the Oni, then choose an attack';hint.textContent='Select the Oni · Tap Slash or 10-Hit Slash Combo';overlay.style.opacity=0;}function pt(e){const r=canvas.getBoundingClientRect(),scale=Math.min(r.width/W,r.height/H),ox=(r.width-W*scale)/2,oy=(r.height-H*scale)/2;return {x:(e.clientX-r.left-ox)/scale,y:(e.clientY-r.top-oy)/scale}}function inRect(p,a){return p.x>=a[0]&&p.y>=a[1]&&p.x<=a[2]&&p.y<=a[3]}function oct(x,y,r){g.beginPath();for(let i=0;i<8;i++){let a=Math.PI/8+i*Math.PI/4,qx=x+Math.cos(a)*r,qy=y+Math.sin(a)*r*.54;i?g.lineTo(qx,qy):g.moveTo(qx,qy)}g.closePath()}function burst(x,y,n=28,color='#ff8fb8'){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=rnd(130,590);state.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,ttl:rnd(.25,.76),max:.76,size:rnd(2,7),color})}}function attack(combo=false){if(state.mode!=='ready')return;state.target=true;state.mode='attacking';state.attack={time:0,length:combo?2.65:.8,hits:combo?10:1,lastHit:0,combo};status.textContent=combo?'✦ SAKURA STORM · CRITICAL COMBO!':'✦ QUICK SLASH!';hint.textContent=combo?'10-HIT CRITICAL ATTACK!':'Quick slash · enemy takes damage';}function victory(){state.mode='win';document.getElementById('result').innerHTML='VICTORY<span>THE ONI WARLORD IS DEFEATED · TAP RESTART</span>';overlay.style.opacity=1;status.textContent='VICTORY';}function enemyRetaliate(){state.mode='enemy';state.retaliateAt=performance.now()+650;status.textContent='ONI RETALIATES!'}function applyHit(hit,combo){let val=combo?(hit===10?640:rnd(200,360)):375;val=Math.round(val);state.enemyHP=Math.max(0,state.enemyHP-val);state.floaters.push({x:rnd(1150,1370),y:rnd(330,440),ttl:1.1,val,crit:hit===10&&combo});state.shake=hit===10?23:10;state.flash=.18;burst(rnd(1160,1340),rnd(370,520),hit===10?75:24,hit===10?'#fff6cf':'#ff72a8');if(state.enemyHP<=0)victory();}function drawSlash(at){const a=state.attack;if(!a)return;let progress=a.time/a.length,per=(progress*a.hits)%1,h=Math.min(a.hits,Math.floor(progress*a.hits)+1),power=a.combo?1:0.6;const x=1175+Math.sin(h*2.7)*75,y=435+Math.cos(h*1.9)*70;g.save();g.globalCompositeOperation='screen';g.translate(x,y);g.rotate(h*1.27);g.strokeStyle='#ff58a7';g.shadowColor='#ff257a';g.shadowBlur=45;g.lineWidth=(22+14*(1-per))*power;g.lineCap='round';g.beginPath();g.arc(0,0,165+per*80,-1.35,1.5);g.stroke();g.strokeStyle='#fff6ff';g.lineWidth=8*power;g.beginPath();g.arc(0,0,160+per*80,-1.3,1.3);g.stroke();g.restore();if(a.combo){g.save();g.font='italic bold 64px Georgia';g.textAlign='center';g.shadowColor='#e0005f';g.shadowBlur=22;g.fillStyle='#fff4ec';g.fillText(h+' HIT!',1090,215);g.restore();}if(h===10&&per>.4){g.save();g.globalAlpha=Math.max(0,1-per);g.globalCompositeOperation='screen';g.translate(1180,465);g.rotate(-.8);let grad=g.createLinearGradient(-250,0,250,0);grad.addColorStop(0,'#ff338700');grad.addColorStop(.5,'#fff8eb');grad.addColorStop(1,'#ff338700');g.fillStyle=grad;g.fillRect(-330,-25,660,50);g.restore();}}function update(dt,now){for(const p of state.petals){p.y+=p.v*dt;p.x+=Math.sin(now*.0008+p.a)*.32;if(p.y>H+12){p.y=-12;p.x=rnd(0,W)}}for(let i=state.particles.length-1;i>=0;i--){let p=state.particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=320*dt;p.ttl-=dt;if(p.ttl<=0)state.particles.splice(i,1)}for(let i=state.floaters.length-1;i>=0;i--){state.floaters[i].ttl-=dt;if(state.floaters[i].ttl<=0)state.floaters.splice(i,1)}state.shake=Math.max(0,state.shake-58*dt);state.flash=Math.max(0,state.flash-1.2*dt);if(state.attack){let a=state.attack;a.time+=dt;let hitCount=Math.min(a.hits,Math.floor(a.time/a.length*a.hits));while(a.lastHit<hitCount){a.lastHit++;applyHit(a.lastHit,a.combo);if(state.mode==='win')break}if(a.time>=a.length||state.mode==='win'){state.attack=null;if(state.mode!=='win')enemyRetaliate()}}if(state.mode==='enemy'&&now>state.retaliateAt){state.heroHP=Math.max(0,state.heroHP-420);state.floaters.push({x:385,y:400,ttl:1.1,val:420,crit:false});burst(430,470,24,'#84dbff');state.shake=13;state.turn++;state.mode='ready';status.textContent='YOUR TURN · Select the Oni and attack';if(state.heroHP===0){state.mode='lost';document.getElementById('result').innerHTML='DEFEAT<span>THE RONIN HAS FALLEN · TAP RESTART</span>';overlay.style.opacity=1}}}function draw(now){g.save();g.translate(rnd(-state.shake,state.shake),rnd(-state.shake,state.shake)*.55);if(art.complete&&art.naturalWidth)g.drawImage(art,0,0,W,H);else{g.fillStyle='#120b20';g.fillRect(0,0,W,H)}// Static original illustration remains completely intact; overlays provide interactive combat feedback.
if(state.selected){g.save();g.shadowColor='#94e9ff';g.shadowBlur=27;g.strokeStyle='#83dfff';g.lineWidth=7;oct(state.selected.x,state.selected.y,93);g.stroke();g.restore()}if(state.target){g.save();g.strokeStyle='#ffeadb';g.lineWidth=5;g.setLineDash([16,12]);g.shadowColor='#f56da5';g.shadowBlur=20;g.beginPath();g.ellipse(1265,455,160,188,0,0,Math.PI*2);g.stroke();g.restore()}// Real HP meters cover the static HP bars with matching decorations.
function hp(x,y,w,v,max,col){g.fillStyle='#16111e';g.fillRect(x,y,w,11);g.shadowBlur=15;g.shadowColor=col;g.fillStyle=col;g.fillRect(x,y,w*v/max,11);g.shadowBlur=0;}hp(153,277,289,state.heroHP,3120,'#7fff82');hp(1261,278,247,state.enemyHP,3860,'#84f89b');g.fillStyle='#fff9f1';g.font='bold 19px Georgia';g.textAlign='center';g.shadowColor='#1a0920';g.shadowBlur=7;g.fillText('HP '+state.heroHP+' / 3120',291,269);g.fillText('HP '+state.enemyHP+' / 3860',1386,269);g.shadowBlur=0;if(state.attack)drawSlash(now);for(const p of state.particles){g.globalAlpha=Math.max(0,p.ttl/p.max);g.shadowColor=p.color;g.shadowBlur=15;g.fillStyle=p.color;g.beginPath();g.arc(p.x,p.y,p.size,0,Math.PI*2);g.fill()}g.globalAlpha=1;for(const f of state.floaters){g.save();g.globalAlpha=Math.min(1,f.ttl*2);g.textAlign='center';g.font=(f.crit?'italic bold 58px':'bold 36px')+' Georgia';g.shadowColor=f.crit?'#ef247b':'#210c20';g.shadowBlur=15;g.fillStyle=f.crit?'#ffe1a3':'#fff9f1';g.fillText('-'+f.val+(f.crit?' CRITICAL!':''),f.x,f.y-(1-f.ttl)*75);g.restore()}for(const p of state.petals){g.save();g.globalAlpha=.55;g.translate(p.x,p.y);g.rotate(now/3200+p.a);g.fillStyle='#ffd4df';g.beginPath();g.ellipse(0,0,p.s*1.5,p.s*.55,.2,0,Math.PI*2);g.fill();g.restore()}if(state.flash){g.fillStyle='rgba(255,218,235,'+state.flash+')';g.fillRect(0,0,W,H)}g.restore();}function frame(now){const dt=prev?Math.min(.05,(now-prev)/1000):.016;prev=now;update(dt,now);draw(now);requestAnimationFrame(frame)}canvas.addEventListener('pointerdown',e=>{if(state.mode!=='ready')return;e.preventDefault();const p=pt(e);if(inRect(p,buttons.ultimate)){attack(true);return}if(inRect(p,buttons.slash)||inRect(p,buttons.gale)){attack(false);return}if(inRect(p,buttons.guard)){state.heroHP=Math.min(3120,state.heroHP+100);hint.textContent='Guard: +100 HP';return}if(inRect(p,buttons.move)){status.textContent='MOVE · Tap an octagon';hint.textContent='Movement destination highlighted on the battlefield';return}if(p.x>1090&&p.x<1455&&p.y>295&&p.y<630){state.target=true;status.textContent='ONI WARLORD TARGETED';hint.textContent='Tap Slash or 10-Hit Slash Combo';return}if(p.x>210&&p.x<1470&&p.y>435&&p.y<700){const centers=[];for(let row=0;row<3;row++)for(let col=0;col<7;col++)centers.push({x:195+col*180+(row%2)*87,y:470+row*69});let best=centers.reduce((a,b)=>Math.hypot(p.x-b.x,p.y-b.y)<Math.hypot(p.x-a.x,p.y-a.y)?b:a);state.selected=best;hint.textContent='Octagon selected · Attack the Oni';}});document.getElementById('restart').onclick=reset;document.addEventListener('keydown',e=>{if(e.key==='1')attack(false);if(e.key==='2'||e.code==='Space')attack(true);if(e.key.toLowerCase()==='r')reset()});reset();requestAnimationFrame(frame)})();
</script></body></html>
