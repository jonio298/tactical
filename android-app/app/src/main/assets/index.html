<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Sakura Tactics</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101025;color:white;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100vw;height:100vh;display:block}#toolbar{position:absolute;left:0;bottom:8px;width:100%;display:flex;justify-content:center;gap:9px;pointer-events:none}button{pointer-events:auto;background:#210c26dd;color:#fff;border:2px solid #fb84ad;border-radius:12px;padding:9px 18px;box-shadow:0 0 15px #f04c8b77;font-weight:bold}button:active{transform:scale(.96)}#hint{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#18142ac9;border:1px solid #e5abb7;border-radius:12px;padding:7px 15px;white-space:nowrap;font-size:13px}
</style></head><body><canvas id="game" width="960" height="540"></canvas><div id="hint">Tap an octagon to move • tap the oni to target</div><div id="toolbar"><button id="strike">STRIKE</button><button id="critical">SAKURA STORM · 10 HIT</button><button id="reset">RESTART</button></div>
<script>
(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d'),hint=document.getElementById('hint');let hero={x:1,y:2,hp:100},enemy={x:5,y:1,hp:200},selected=false,busy=false,fx=[],combo=0,over=false,t=0;const W=960,H=540,ox=190,oy=235,sx=105,sy=67;function reset(){hero={x:1,y:2,hp:100};enemy={x:5,y:1,hp:200};selected=false;busy=false;fx=[];combo=0;over=false;hint.textContent='Tap an octagon to move • tap the oni to target'}function pos(x,y){return {x:ox+x*sx+(y%2)*sx*.5,y:oy+y*sy}}function oct(x,y,r){ctx.beginPath();for(let i=0;i<8;i++){let a=Math.PI/8+i*Math.PI/4,pX=x+Math.cos(a)*r,pY=y+Math.sin(a)*r; i?ctx.lineTo(pX,pY):ctx.moveTo(pX,pY)}ctx.closePath()}function burst(x,y,col,count=14){for(let i=0;i<count;i++){let a=Math.random()*Math.PI*2,s=2+Math.random()*7;fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,ttl:30+Math.random()*20,color:col})}}function fighter(p,type){let q=pos(p.x,p.y),x=q.x,y=q.y-16;ctx.save();ctx.translate(x,y);ctx.shadowBlur=20;ctx.shadowColor=type==='hero'?'#ff527f':'#56caff';ctx.strokeStyle=type==='hero'?'#ff779a':'#6bdaff';ctx.fillStyle=type==='hero'?'#210f22':'#111c2d';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-13,-7);ctx.lineTo(-21,23);ctx.moveTo(13,-7);ctx.lineTo(20,23);ctx.moveTo(-8,-36);ctx.lineTo(-13,-5);ctx.lineTo(12,-5);ctx.lineTo(7,-36);ctx.closePath();ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(0,-46,13,0,Math.PI*2);ctx.fill();ctx.stroke();if(type==='hero'){ctx.beginPath();ctx.moveTo(-34,-53);ctx.lineTo(0,-72);ctx.lineTo(32,-53);ctx.closePath();ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(12,-25);ctx.lineTo(43,12);ctx.stroke()}else{ctx.beginPath();ctx.moveTo(-12,-52);ctx.lineTo(-25,-74);ctx.lineTo(-6,-61);ctx.moveTo(12,-52);ctx.lineTo(25,-74);ctx.lineTo(6,-61);ctx.stroke()}ctx.restore();let health=type==='hero'?100:200;ctx.fillStyle='#180d23';ctx.fillRect(x-35,y-95,70,7);ctx.fillStyle=type==='hero'?'#fa658b':'#62cefb';ctx.fillRect(x-35,y-95,70*Math.max(0,p.hp)/health,7)}function slash(){if(busy||over)return;busy=true;selected=true;let i=0;hint.textContent='SAKURA STORM — 10 HIT CRITICAL!';let timer=setInterval(()=>{if(over){clearInterval(timer);busy=false;return}i++;combo=i;let q=pos(enemy.x,enemy.y);burst(q.x,q.y-45,i===10?'#fff2b0':'#ff679d',i===10?55:14);fx.push({arc:true,x:q.x,y:q.y-45,ttl:10+Math.random()*5,color:'#ff79bb',angle:Math.random()*6.28});enemy.hp=Math.max(0,enemy.hp-(i===10?45:12));if(i>=10||enemy.hp<=0){clearInterval(timer);busy=false; if(enemy.hp<=0){over=true;hint.textContent='VICTORY — The oni is defeated!'}else retaliation()}},150)}function retaliation(){hero.hp=Math.max(0,hero.hp-12);let q=pos(hero.x,hero.y);burst(q.x,q.y-50,'#72ccff',20);hint.textContent=hero.hp? 'Enemy retaliates! Move or attack again.' : 'DEFEAT — Tap RESTART';if(!hero.hp)over=true}function strike(){if(busy||over)return;let q=pos(enemy.x,enemy.y);if(!selected){selected=true;hint.textContent='Oni targeted. Tap STRIKE again.';return}burst(q.x,q.y-42,'#ff9abd',25);enemy.hp=Math.max(0,enemy.hp-25);if(enemy.hp===0){over=true;hint.textContent='VICTORY — The oni is defeated!'}else retaliation()}function draw(){t++;let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#f6a0b1');g.addColorStop(.4,'#a88bb6');g.addColorStop(.72,'#3f405b');g.addColorStop(1,'#14162c');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#ed5977';ctx.beginPath();ctx.arc(675,105,68,0,Math.PI*2);ctx.fill();ctx.fillStyle='#52506b';ctx.beginPath();ctx.moveTo(0,240);ctx.lineTo(235,70);ctx.lineTo(450,245);ctx.fill();ctx.fillStyle='#bbb3cf';ctx.beginPath();ctx.moveTo(174,117);ctx.lineTo(235,70);ctx.lineTo(294,120);ctx.lineTo(242,104);ctx.lineTo(216,116);ctx.fill();ctx.fillStyle='#272739';ctx.beginPath();ctx.moveTo(610,240);ctx.lineTo(752,136);ctx.lineTo(930,240);ctx.fill();ctx.fillStyle='#c2dce8';ctx.fillRect(788,190,27,75);ctx.fillStyle='#a5d1dc';for(let i=0;i<15;i++){ctx.fillRect(788+Math.random()*27,220+Math.random()*50,2,20)}ctx.strokeStyle='#37202a';ctx.lineWidth=15;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(140,20);ctx.lineTo(330,0);ctx.stroke();for(let i=0;i<90;i++){let x=(Math.sin(i*39.1)*.5+.5)*W,y=(Math.cos(i*17.4)*.5+.5)*260;ctx.fillStyle=i%2?'#ffcade':'#ec6388';ctx.beginPath();ctx.arc(x,y,2+i%4,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#141d32bd';ctx.fillRect(90,210,790,295);for(let y=0;y<4;y++)for(let x=0;x<7;x++){let p=pos(x,y),isHero=hero.x===x&&hero.y===y,isEnemy=enemy.x===x&&enemy.y===y;ctx.shadowBlur=13;ctx.shadowColor=isHero?'#36caff':isEnemy?'#ff355b':'#ed719a';ctx.fillStyle=isHero?'#134360aa':isEnemy?'#693145bb':'#31354a9e';ctx.strokeStyle=isHero?'#3fe4ff':isEnemy?'#ff4979':'#f9a0b7';ctx.lineWidth=isHero||isEnemy?5:2;oct(p.x,p.y,45);ctx.fill();ctx.stroke();ctx.shadowBlur=0}fighter(hero,'hero');if(enemy.hp>0)fighter(enemy,'enemy');for(let f of fx){ctx.globalAlpha=Math.min(1,f.ttl/15);ctx.strokeStyle=f.color;ctx.fillStyle=f.color;ctx.shadowColor=f.color;ctx.shadowBlur=14;if(f.arc){ctx.lineWidth=7;ctx.beginPath();ctx.arc(f.x,f.y,65,f.angle,f.angle+2.2);ctx.stroke()}else{ctx.beginPath();ctx.arc(f.x,f.y,2.7,0,Math.PI*2);ctx.fill();f.x+=f.vx;f.y+=f.vy;f.vy+=.07}f.ttl--;ctx.globalAlpha=1;ctx.shadowBlur=0}fx=fx.filter(f=>f.ttl>0);ctx.fillStyle='#280f27b8';ctx.fillRect(10,12,255,57);ctx.fillRect(695,12,255,57);ctx.font='bold 19px system-ui';ctx.fillStyle='#ffe6e7';ctx.fillText('RONIN  '+hero.hp+'/100',24,46);ctx.fillText('ONI  '+enemy.hp+'/200',720,46);if(busy){ctx.textAlign='center';ctx.font='bold 38px system-ui';ctx.fillStyle='#ffedf6';ctx.shadowBlur=18;ctx.shadowColor='#ff0077';ctx.fillText(combo+' HIT!',480,115);ctx.shadowBlur=0;ctx.textAlign='left'}requestAnimationFrame(draw)}function click(e){if(busy||over)return;let r=c.getBoundingClientRect(),mx=(e.clientX-r.left)*W/r.width,my=(e.clientY-r.top)*H/r.height;let best=null,d=1e9;for(let y=0;y<4;y++)for(let x=0;x<7;x++){let p=pos(x,y),dd=Math.hypot(mx-p.x,my-p.y);if(dd<d){d=dd;best={x,y}}}if(d>52)return;if(best.x===enemy.x&&best.y===enemy.y){selected=true;hint.textContent='Oni selected. Choose STRIKE or SAKURA STORM.';return}if(Math.abs(best.x-hero.x)+Math.abs(best.y-hero.y)>3){hint.textContent='Move up to three spaces at a time.';return}if(best.x===enemy.x&&best.y===enemy.y)return;hero.x=best.x;hero.y=best.y;hint.textContent='Samurai moved. Select enemy and attack.'}c.addEventListener('pointerdown',click);document.getElementById('strike').onclick=strike;document.getElementById('critical').onclick=slash;document.getElementById('reset').onclick=reset;window.addEventListener('keydown',e=>{if(e.key==='1')strike();if(e.key==='2'||e.key===' ')slash();if(e.key.toLowerCase()==='r')reset()});draw()})()
</script></body></html>
